<!DOCTYPE html>
<html>
<head>
    <title>Milacvrienden</title>
</head>
<body>

<h2>Kies seizoen</h2>

<select id="seizoenSelect">
    <option value="">-- Kies een seizoen --</option>
    {% for s in seizoenen %}
        <option value="{{ s }}">{{ s }}</option>
    {% endfor %}
</select>

<br><br>

<button onclick="gaNaarOverzicht()">📊 Overzicht bekijken</button>

<script>
function gaNaarOverzicht() {
    const seizoen = document.getElementById("seizoenSelect").value;
    if (!seizoen) {
        alert("Kies eerst een seizoen");
        return;
    }
    window.location.href = "/overzicht/" + seizoen;
}
</script>

<hr>

<h3>🔒 Beheer</h3>

<form method="post" action="/nieuw_seizoen">
    <input
        type="text"
        name="seizoen"
        placeholder="Nieuw seizoen (bv. 2026-2027)"
        required
    >
    <br><br>
    <input
        type="password"
        name="password"
        placeholder="Beheerderswachtwoord"
        required
    >
    <br><br>
    <button type="submit">➕ Nieuw seizoen aanmaken</button>
</form>

</body>
</html>
