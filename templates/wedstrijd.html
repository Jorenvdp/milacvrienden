<!DOCTYPE html>
<html>
<head>
    <title>Wedstrijd</title>
</head>
<body>

<h2>Wedstrijd – {{ seizoen }}</h2>

<form method="post">
<label><strong>Naam van de wedstrijd</strong></label><br>
<input
    type="text"
    name="wedstrijdnaam"
    placeholder="Bv.Milacvrienden"
>
<br><br>
    
Goals:
<select name="goals" id="goals" onchange="this.form.submit()">
{% for i in range(11) %}
<option value="{{ i }}" {% if i == goals %}selected{% endif %}>
{{ i }}
</option>
{% endfor %}
</select>
 
<button type="submit" name="toon_goals">
Toon goalvelden
</button>


Tegen:
<select name="tegen">
    {% for i in range(11) %}
        <option value="{{ i }}">{{ i }}</option>
    {% endfor %}
</select>

<br><br>

Keeper:
<select name="keeper">
{% for s in spelers %}
<option value="{{ s }}">{{ s }}</option>
{% endfor %}
</select>
 
Saves:
<input type="number" name="saves" value="0" min="0">
 
<br><br>
    
{% for i in range(goals) %}

    <p>Goal {{ i + 1 }}</p>

    <select name="maker{{ i }}">
        <option value="OWONGOAL">Owngoal</option>
        {% for s in spelers %}
            <option value="{{ s }}">{{ s }}</option>
        {% endfor %}
    </select>

    <select name="assist{{ i }}">
        <option value="">Geen</option>
        {% for s in spelers %}
            <option value="{{ s }}">{{ s }}</option>
        {% endfor %}
    </select>

{% endfor %}

<br><br>
<label>Beheerderswachtwoord</label><br>
<input type="password" name="password">

<br><br>
<button type="submit" name="submit">Opslaan</button>

</form>    

<br><br>

<a href="{{ url_for('index') }}">Ga terug naar beginpagina</a>    
    
</body>
</html>
